name: color-correction-api

services:
  color-api:
    image: color-correction-api:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${BIND_HOST:-0.0.0.0}:5522:5522"
    environment:
      CMYK_API_WORK_DIR: /data
      CMYK_API_MAX_UPLOAD_GIB: ${CMYK_API_MAX_UPLOAD_GIB:-64}
      CMYK_API_MAX_CSV_MIB: ${CMYK_API_MAX_CSV_MIB:-64}
      CMYK_API_MAX_IMAGE_MIB: ${CMYK_API_MAX_IMAGE_MIB:-512}
      CMYK_API_MAX_IMAGE_PIXELS: ${CMYK_API_MAX_IMAGE_PIXELS:-268435456}
      CMYK_API_UPLOAD_CHUNK_MIB: ${CMYK_API_UPLOAD_CHUNK_MIB:-8}
      CMYK_API_MAX_PENDING_JOBS: ${CMYK_API_MAX_PENDING_JOBS:-4}
      CMYK_API_JOB_TTL_HOURS: ${CMYK_API_JOB_TTL_HOURS:-24}
      CMYK_API_CLEANUP_INTERVAL_SECONDS: ${CMYK_API_CLEANUP_INTERVAL_SECONDS:-3600}
      CMYK_API_CACHE_TTL_HOURS: ${CMYK_API_CACHE_TTL_HOURS:-24}
      CMYK_PDF_NATIVE_MAX_PIXELS: ${CMYK_PDF_NATIVE_MAX_PIXELS:-64000000}
      CMYK_PDF_PARSE_MAX_TOKENS: ${CMYK_PDF_PARSE_MAX_TOKENS:-20000000}
      CMYK_API_FORCE_CPU: "false"
      CUPY_CACHE_DIR: /data/cupy-cache
      TMPDIR: /data/tmp
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - "${CMYK_API_OUTPUT_DIR:-./output}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
