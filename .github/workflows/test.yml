name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMYK_API_FORCE_CPU: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run tests with explicit CPU test backend
        run: python -m pytest tests -q
      - name: Validate deployment files
        run: |
          bash -n deploy.sh restart.sh
          docker compose config --quiet

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable CUDA image
        run: docker build --tag color-correction-api:ci .
