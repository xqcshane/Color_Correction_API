name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: color-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMYK_API_FORCE_CPU: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Run tests with explicit CPU test backend
        run: python -m pytest tests -q
      - name: Validate deployment files
        run: |
          bash -n deploy.sh restart.sh
          docker compose config --quiet

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable CUDA image
        run: docker build --tag color-correction-api:ci .
      - name: Start image with the explicit CPU test backend
        run: docker run -d --name color-api-ci -e CMYK_API_FORCE_CPU=true color-correction-api:ci
      - name: Exercise both PDF APIs inside the built container
        run: docker exec color-api-ci python /app/scripts/smoke_test.py
      - name: Container logs
        if: always()
        run: docker logs color-api-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f color-api-ci || true
